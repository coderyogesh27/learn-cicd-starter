name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Run buildprod
        run: ./scripts/buildprod.sh

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/827347737898/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: cloud-run-deployer@eternal-cycling-506207-f5.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: eternal-cycling-506207-f5

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/eternal-cycling-506207-f5/notely-ar-repo/notely:latest \
            .
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/eternal-cycling-506207-f5/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project eternal-cycling-506207-f5 --max-instances=4